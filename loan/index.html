<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>放款知識庫</title>
  <meta name="description" content="放款業務規則查詢、學習與變更複核入口">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b3156'/%3E%3Cpath d='M16 18h32v7H16zm0 13h22v7H16zm0 13h28v7H16z' fill='%23f2c66d'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#edf6ff">
  <link rel="stylesheet" href="./styles.css?v=20261006-reader-r2">
</head>
<body>
  <aside class="sidebar" aria-label="放款知識庫導覽"><div class="brand-icon">L</div><div class="side-brand"><b>LOAN WORKSPACE</b><small>EDAN’S WORKSPACE</small></div><div class="side-label">MODULES</div><nav id="module-nav"></nav><div class="side-bottom">情境查詢 · 來源追溯<br>正式需求請回查原始文件。</div></aside>
  <header><div class="head"><div><div class="eyebrow">CTBC LOAN KNOWLEDGE</div><h1>中國信託放款知識庫</h1></div><div class="updated" id="updated">更新 · 2026-10-05</div></div></header>
  <main>
    <section id="knowledge" class="toolbar" aria-label="知識搜尋">
      <div class="search"><input id="q" type="search" placeholder="輸入情境編號（如 放_04_1193）、Requirement ID、關鍵字…" aria-label="搜尋知識"></div>
      <div class="filters" id="categories" aria-label="內容模組"></div><div class="filters"><label>流程分類 <select id="group" class="chip" aria-label="流程分類"></select></label><label>主題 <select id="topic" class="chip" aria-label="主題篩選"></select></label><label>來源 <select id="source" class="chip" aria-label="來源篩選"></select></label></div><div class="filters" id="filters"></div><div class="filters" aria-label="閱讀視圖"><button class="chip active" data-view="work">工作查詢</button><button class="chip" data-view="learn">學習閱讀</button><button class="chip" data-view="review">變更複核</button></div>
    </section>
    <section id="workspace-tools" class="workspace-tools" aria-label="模組操作"></section>
    <section class="summary" id="summary"></section>
    <div class="notice" id="coverage"></div>
    <div class="list-heading"><h2 id="module-title">知識庫</h2><span id="result-count" aria-live="polite"></span></div><div id="pagination" class="pagination"></div>
    <section class="layout">
      <div class="list" id="list"></div>
      <article class="detail" id="detail"><div class="empty">請選擇左側知識項目</div></article>
    </section>
  </main>
  <dialog id="editor-dialog" aria-label="知識編輯器"></dialog>
  <script src="./workspace.js?v=20261006-reader-r2" defer></script>
  <script src="./app.js?v=20261006-reader-r2" defer></script>
</body>
</html>
